kind = "web"
previewPath = "/"
title = "Alexa Gray"
version = "1.0.0"
id = "artifacts/alexa-gray"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21400

[services.development]
run = "pnpm --filter @workspace/alexa-gray run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/alexa-gray", "run", "build" ]
serve = "static"
publicDir = "artifacts/alexa-gray/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21400"
BASE_PATH = "/"
